<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · Cumple de Bert</title>
    <script>
      ;(function () {
        if (localStorage.getItem('theme') === 'amber') {
          document.documentElement.setAttribute('data-theme', 'amber')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/main.js"></script>
    <style>
      :root {
        --bg: #030904;
        --bg-panel: #061a0c;
        --bg-input: #04140a;
        --green: #35ff6f;
        --green-bright: #a8ffc4;
        --green-dim: #1f8f45;
        --green-faint: rgba(53, 255, 111, 0.35);
        --glow:
          0 0 6px rgba(53, 255, 111, 0.65), 0 0 16px rgba(53, 255, 111, 0.3);
        --red: #ff5c5c;
        --grey: #6f8a76;
        --menu-accent: #fbe10b;
        --menu-accent-faint: rgba(251, 225, 11, 0.3);
      }

      [data-theme='amber'] {
        --bg: #0a0602;
        --bg-panel: #1a1004;
        --bg-input: #150c02;
        --green: #ffb703;
        --green-bright: #ffe29a;
        --green-dim: #a06a00;
        --green-faint: rgba(255, 183, 3, 0.35);
        --glow: 0 0 6px rgba(255, 183, 3, 0.6), 0 0 16px rgba(255, 183, 3, 0.3);
        --red: #ff6b57;
        --grey: #8a7a5c;
        --menu-accent: #35d7ff;
        --menu-accent-faint: rgba(53, 215, 255, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--green);
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        overflow-x: hidden;
        transition:
          background-color 0.2s,
          color 0.2s;
      }

      .fi {
        display: inline-block;
        line-height: 1;
      }

      /* CRT OVERLAY: scanlines + vignette, fixed over the whole viewport */
      .crt-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
      }

      .crt-overlay::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 1px,
          rgba(0, 0, 0, 0.35) 2px,
          rgba(0, 0, 0, 0) 3px
        );
        mix-blend-mode: multiply;
      }

      .crt-overlay::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 60%,
          rgba(0, 0, 0, 0.65) 100%
        );
      }

      @keyframes crt-flicker {
        0%,
        100% {
          opacity: 1;
        }
        92% {
          opacity: 1;
        }
        93% {
          opacity: 0.94;
        }
        94% {
          opacity: 1;
        }
      }

      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      .cursor {
        display: inline-block;
        animation: blink 1s steps(1) infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .terminal,
        .cursor {
          animation: none;
        }
      }

      /* SHELL: fills the whole viewport */
      .terminal {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        width: 100%;
        animation: crt-flicker 6s infinite;
      }

      .term-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--green-dim);
        background: var(--bg-panel);
      }

      .term-dots {
        display: flex;
        gap: 6px;
      }

      .term-dots i {
        width: 9px;
        height: 9px;
        border: 1px solid var(--green-dim);
        background: transparent;
      }

      .term-title {
        flex: 1;
        font-size: 0.85rem;
        letter-spacing: 1px;
        color: var(--green-dim);
        text-transform: uppercase;
      }

      .term-toggle {
        background: transparent;
        border: 1px solid var(--green-dim);
        color: var(--green);
        font-family: inherit;
        font-size: 0.75rem;
        letter-spacing: 1px;
        padding: 4px 10px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s,
          box-shadow 0.2s;
      }

      .term-toggle:hover {
        border-color: var(--green);
        box-shadow: var(--glow);
      }

      .term-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: clamp(20px, 4vh, 48px) clamp(16px, 4vw, 40px);
      }

      .term-content {
        width: 100%;
        max-width: 920px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      h1 {
        font-family: 'VT323', monospace;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--green-bright);
        text-shadow: var(--glow);
        border-bottom: 1px dashed var(--green-dim);
        padding-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .field-row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }

      input[type='text'],
      input[type='password'] {
        flex: 1;
        padding: 9px 10px;
        border: 1px solid var(--green-dim);
        font-family: inherit;
        font-size: 0.9rem;
        background: var(--bg-input);
        color: var(--green);
      }

      input[type='text']:focus,
      input[type='password']:focus {
        outline: none;
        border-color: var(--green);
        box-shadow: var(--glow);
      }

      button {
        font-family: inherit;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        background: transparent;
        color: var(--green);
        border: 1px solid var(--green-dim);
        padding: 9px 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          color 0.15s;
      }

      button::before {
        content: '[ ';
      }

      button::after {
        content: ' ]';
      }

      button:hover {
        border-color: var(--green);
        color: var(--green-bright);
        box-shadow: var(--glow);
      }

      .copy-btn {
        padding: 4px 6px;
      }

      .error-msg {
        color: var(--red);
        font-size: 0.8rem;
        margin-top: 4px;
        min-height: 1.2em;
      }

      #panelView[hidden],
      #loginView[hidden] {
        display: none;
      }

      #loginView {
        border: 1px solid var(--green-dim);
        background: var(--bg-panel);
        padding: 20px;
      }

      .invitee-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        font-size: 0.85rem;
      }

      .invitee-table th {
        text-align: left;
        font-size: 0.75rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--green-dim);
        border-bottom: 1px solid var(--green-dim);
        padding: 8px 6px;
      }

      .invitee-table td {
        padding: 10px 6px;
        border-bottom: 1px dashed var(--green-dim);
        vertical-align: middle;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-weight: 700;
        font-size: 0.8rem;
        text-transform: uppercase;
      }

      .status-pending {
        color: var(--grey);
      }
      .status-confirmed {
        color: var(--green);
        text-shadow: 0 0 6px var(--green-faint);
      }
      .status-cancelled {
        color: var(--red);
      }

      .link-cell {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      input.alias-input {
        width: 100%;
        min-width: 90px;
        padding: 5px 7px;
        font-size: 0.8rem;
        color: var(--grey);
        font-style: italic;
      }

      input.alias-input:focus {
        color: var(--green);
        font-style: normal;
      }

      .link-cell code {
        overflow-wrap: anywhere;
        color: var(--green-dim);
        font-size: 0.8rem;
      }

      .empty-msg {
        text-align: center;
        color: var(--green-dim);
        padding: 20px 0;
      }

      .summary-panel {
        border: 1px solid var(--green-dim);
        background: var(--bg-panel);
        padding: 16px;
      }

      .hero-stat {
        border: 1px solid var(--green);
        box-shadow: var(--glow);
        text-align: center;
        padding: 14px 8px;
        margin-bottom: 14px;
      }

      .hero-value {
        display: block;
        font-family: 'VT323', monospace;
        font-size: 3rem;
        line-height: 1;
        color: var(--green-bright);
        text-shadow: var(--glow);
      }

      .hero-label {
        display: block;
        font-size: 0.7rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--green-dim);
        margin-top: 6px;
      }

      .summary-stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 14px;
      }

      .stat {
        border: 1px solid var(--green-dim);
        padding: 10px 4px;
        text-align: center;
      }

      .stat-value {
        display: block;
        font-family: 'VT323', monospace;
        font-size: 1.8rem;
        line-height: 1;
      }

      .stat.status-pending .stat-value {
        color: var(--grey);
      }
      .stat.status-confirmed .stat-value {
        color: var(--green-bright);
        text-shadow: var(--glow);
      }
      .stat.status-cancelled .stat-value {
        color: var(--red);
      }

      .stat-label {
        display: block;
        font-size: 0.65rem;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-top: 4px;
        color: var(--green-dim);
      }

      /* FILTER BOXES: the stat + menu boxes double as toggleable list filters */
      .stat-filter {
        display: block;
        width: 100%;
        font-family: inherit;
        cursor: pointer;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          background-color 0.15s;
      }

      .stat-filter::before,
      .stat-filter::after {
        content: none;
      }

      .stat-filter:hover {
        border-color: var(--green);
      }

      .stat-filter.active {
        border-color: var(--green);
        background: color-mix(in srgb, var(--green) 12%, transparent);
        box-shadow: var(--glow);
      }

      .menu-stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 4px;
      }

      @media (max-width: 480px) {
        .menu-stats {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .menu-stat {
        border-color: var(--menu-accent);
        padding: 10px 4px;
      }

      .menu-stat i {
        font-size: 1.3rem;
        color: var(--menu-accent);
      }

      .menu-stat .stat-value {
        color: var(--menu-accent);
        margin-top: 4px;
      }

      .menu-stat:hover {
        border-color: var(--menu-accent);
        box-shadow: 0 0 10px var(--menu-accent-faint);
      }

      .menu-stat.active {
        background: color-mix(in srgb, var(--menu-accent) 14%, transparent);
        box-shadow:
          0 0 10px var(--menu-accent-faint),
          0 0 18px var(--menu-accent-faint);
      }

      .menu-icons {
        display: flex;
        gap: 6px;
        font-size: 1rem;
        color: var(--menu-accent);
      }

      .menu-icons-empty {
        color: var(--green-dim);
      }

      .delete-btn {
        padding: 4px 6px;
        color: var(--red);
        border-color: var(--red);
      }

      .delete-btn:hover {
        border-color: var(--red);
        color: var(--red);
        box-shadow: 0 0 10px rgba(255, 92, 92, 0.4);
      }

      .export-row {
        margin-top: 12px;
      }

      .name-filter {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
        padding: 0 10px;
        border: 1px solid var(--green-dim);
        background: var(--bg-input);
      }

      .name-filter i {
        color: var(--green-dim);
        font-size: 0.9rem;
      }

      .name-filter input {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--green);
        font-family: inherit;
        font-size: 0.9rem;
        padding: 9px 0;
      }

      .name-filter input:focus {
        outline: none;
      }

      .name-filter:focus-within {
        border-color: var(--green);
        box-shadow: var(--glow);
      }

      @media (max-width: 640px) {
        .summary-stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .invitee-table {
          font-size: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="crt-overlay"></div>
    <div class="terminal">
      <header class="term-bar">
        <span class="term-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="term-title"
          >ADMIN://INVITADOS<span class="cursor">▋</span></span
        >
        <button
          type="button"
          id="themeToggle"
          class="term-toggle"
          aria-label="Cambiar modo de color"
          onclick="toggleTheme()"
        >
          AMBAR
        </button>
      </header>

      <main class="term-body">
        <div class="term-content">
          <h1><i class="fi fi-rr-users-alt"></i> Admin · Invitados</h1>

          <div id="loginView">
            <div class="field-row">
              <input
                type="password"
                id="passwordInput"
                placeholder="Contraseña de administrador"
              />
              <button type="button" id="loginBtn">Ingresar</button>
            </div>
            <div class="error-msg" id="loginError"></div>
          </div>

          <div id="panelView" hidden>
            <form id="createForm" class="field-row">
              <input
                type="text"
                id="nameInput"
                placeholder="Nombre y apellido del invitado"
                required
              />
              <button type="submit">
                <i class="fi fi-rr-user-add"></i> Generar invitación
              </button>
            </form>
            <div class="error-msg" id="createError"></div>

            <div class="summary-panel">
              <div class="hero-stat">
                <span class="hero-value" id="totalPeopleValue">0</span>
                <span class="hero-label"
                  ><i class="fi fi-rr-users-alt"></i> Personas confirmadas
                  (invitados + acompañantes)</span
                >
              </div>
              <div class="summary-stats">
                <button
                  type="button"
                  class="stat stat-filter"
                  data-filter="status:total"
                >
                  <span class="stat-value" id="statTotal">0</span>
                  <span class="stat-label">Invitados</span>
                </button>
                <button
                  type="button"
                  class="stat stat-filter status-pending"
                  data-filter="status:pending"
                >
                  <span class="stat-value" id="statPending">0</span>
                  <span class="stat-label">Pendientes</span>
                </button>
                <button
                  type="button"
                  class="stat stat-filter status-confirmed"
                  data-filter="status:confirmed"
                >
                  <span class="stat-value" id="statConfirmed">0</span>
                  <span class="stat-label">Confirmaron</span>
                </button>
                <button
                  type="button"
                  class="stat stat-filter status-cancelled"
                  data-filter="status:cancelled"
                >
                  <span class="stat-value" id="statCancelled">0</span>
                  <span class="stat-label">Cancelaron</span>
                </button>
              </div>
              <div class="menu-stats" id="menuBreakdown"></div>
              <div class="export-row">
                <button type="button" id="exportBtn">
                  <i class="fi fi-rr-file-export"></i> Exportar CSV
                </button>
              </div>
            </div>

            <div class="name-filter">
              <i class="fi fi-rr-search"></i>
              <input
                type="text"
                id="nameFilterInput"
                placeholder="Buscar invitado por nombre..."
              />
            </div>

            <table class="invitee-table">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Alias</th>
                  <th>Estado</th>
                  <th>Acomp.</th>
                  <th>Menú</th>
                  <th>Link</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="inviteesBody"></tbody>
            </table>
            <div class="empty-msg" id="emptyMsg" hidden>
              Todavía no agregaste invitados.
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      function updateThemeLabel() {
        const isAmber =
          document.documentElement.getAttribute('data-theme') === 'amber'
        document.getElementById('themeToggle').textContent = isAmber
          ? 'VERDE'
          : 'AMBAR'
      }

      function toggleTheme() {
        const isAmber =
          document.documentElement.getAttribute('data-theme') === 'amber'
        if (isAmber) {
          document.documentElement.removeAttribute('data-theme')
          localStorage.setItem('theme', 'green')
        } else {
          document.documentElement.setAttribute('data-theme', 'amber')
          localStorage.setItem('theme', 'amber')
        }
        updateThemeLabel()
      }

      updateThemeLabel()
    </script>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
